    setvbuf: () => 0,
    usleep: () => 0,
    read: () => 0,
    write: (stream, pointer, count) => { emit(stream === 2 ? 2 : 1, text(pointer, count)); return count; },
    printf: (pattern, ...values) => { const out = format(pattern, values); emit(1, out); return out.length; },
    fprintf: (stream, pattern, ...values) => { const out = format(pattern, values); emit(2, out); return out.length; },
    snprintf: (target, size, pattern, ...values) => {
        const out = encoder.encode(format(pattern, values));
        refresh();
        if (size > 0) {
            const count = Math.min(out.length, size - 1);
            bytes.set(out.subarray(0, count), target);
            bytes[target + count] = 0;
        }
        return out.length;
    },
    exit: code => { throw new Exit(code); },
    abort: () => { throw new Exit(134); },
    time: () => Math.floor(Date.now() / 1000),
    sinf: Math.sin, cosf: Math.cos, tanf: Math.tan, sqrtf: Math.sqrt, floorf: Math.floor, ceilf: Math.ceil,
    fabsf: Math.abs, powf: Math.pow, atan2f: Math.atan2, atanf: Math.atan, asinf: Math.asin, acosf: Math.acos,
    expf: Math.exp, logf: Math.log, fmodf: (a, b) => a % b, roundf: Math.round,
    sin: Math.sin, cos: Math.cos, tan: Math.tan, sqrt: Math.sqrt, floor: Math.floor, ceil: Math.ceil,
    fabs: Math.abs, pow: Math.pow, atan2: Math.atan2, atan: Math.atan, exp: Math.exp, log: Math.log, fmod: (a, b) => a % b
};

const warned = new Set();
const provided = Object.assign({}, library, windowing, graphics);
const environment = new Proxy(provided, {
    get(target, name) {
        if (name in target) return target[name];
        return function () {
            if (!warned.has(name)) {
                warned.add(name);
                console.warn("missing import " + String(name));
            }
            return 0;
        };
    }
});

function run(rewinding) {
    try {
        if (rewinding) exports.mode.value = 2;
        exports.main(0n, 0n);
    } catch (problem) {
        if (problem instanceof Exit) return;
        throw problem;
    }
    if (exports.mode.value === 1) {
        exports.mode.value = 0;
        requestAnimationFrame(frame);
    }
}
function frame() {
    fit();
    run(true);
}

const binary = Uint8Array.from(atob(program), c => c.charCodeAt(0));
WebAssembly.instantiate(binary, { env: environment }).then(result => {
    exports = result.instance.exports;
    memory = exports.memory;
    table = exports.table;
    heapTop = (exports.heap.value + 15) & ~15;
    refresh();
    run(false);
});
})();
